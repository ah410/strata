name: Snyk
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '30 5 * * 1'
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      # The Snyk Go container's toolchain is older than go.mod asks for, so run
      # the CLI here. The embed needs a dist folder to type-check.
      - run: mkdir -p backend/dist && touch backend/dist/.placeholder
      - uses: snyk/actions/setup@11b673cfb4b0dc0d860a1323caa199d54950dcce # master
      - name: Snyk Open Source (backend)
        working-directory: backend
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk test --file=go.mod --severity-threshold=high

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Snyk Open Source (frontend)
        uses: snyk/actions/node@11b673cfb4b0dc0d860a1323caa199d54950dcce # master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          # The lockfile pins the tree, so no npm install is needed.
          args: --file=frontend/package-lock.json --severity-threshold=high
