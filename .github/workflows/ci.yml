name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to commit SHAs (tag in the comment): a moved or hijacked
# tag can't change what runs here.
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund --ignore-scripts
      - run: npm test
      # tsc type-checks, then Vite writes the UI into backend/dist.
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui
          path: backend/dist
          retention-days: 3

  backend:
    needs: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      # The binary embeds the UI, so tests and build need the real dist.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ui
          path: backend/dist
      - run: go mod verify
      - run: go vet ./...
      - run: go test -race -cover ./...
      - run: CGO_ENABLED=0 go build -trimpath -o strata .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: strata-linux-amd64
          path: backend/strata
          retention-days: 7

  govulncheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      # govulncheck only needs the code to type-check; a placeholder dist does.
      - run: mkdir -p dist && touch dist/.placeholder
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -t strata:ci .
      # Smoke test with the same lockdown the NAS uses.
      - name: Run hardened container
        run: |
          mkdir -p "$RUNNER_TEMP/data" && echo ok > "$RUNNER_TEMP/data/a.txt"
          docker run -d --name strata --read-only --tmpfs /tmp --cap-drop ALL \
            --security-opt no-new-privileges:true -e STRATA_AUTH=none \
            -v "$RUNNER_TEMP/data:/data:ro" strata:ci
          for i in $(seq 1 20); do
            docker exec strata /usr/local/bin/strata healthcheck && exit 0
            sleep 1
          done
          docker logs strata
          exit 1
