name: Release
on:
  push:
    tags: ["v*.*.*"]
permissions:
  contents: read

# Actions are pinned to commit SHAs (tag in the comment).
jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: write # the GitHub release
      packages: write # push to GHCR
      id-token: write # cosign keyless signing
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.ref_name }}
          # SLSA provenance and an SBOM, attached to the image index.
          provenance: mode=max
          sbom: true
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      # Keyless: the signature binds the digest to this workflow run.
      - run: cosign sign --yes "$IMAGE@$DIGEST"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          # This version's CHANGELOG section, then how to pull and verify it.
          awk -v v="${TAG#v}" '$0 ~ "^## "v" " {on=1; next} /^## / && on {exit} on' CHANGELOG.md > notes.md
          {
            printf '\n## Image\n\n```\n%s:%s@%s\n```\n\n' "$IMAGE" "${TAG#v}" "$DIGEST"
            printf 'Verify with:\n\n```\ncosign verify %s@%s \\\n' "$IMAGE" "$DIGEST"
            printf '  --certificate-identity-regexp "^https://github.com/%s/" \\\n' "$GITHUB_REPOSITORY"
            printf '  --certificate-oidc-issuer https://token.actions.githubusercontent.com\n```\n'
          } >> notes.md
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes-file notes.md --verify-tag
