name: Snyk
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '30 5 * * 1'
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Snyk Open Source (backend)
        uses: snyk/actions/golang@11b673cfb4b0dc0d860a1323caa199d54950dcce # master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --file=backend/go.mod --severity-threshold=high

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Snyk Open Source (frontend)
        uses: snyk/actions/node@11b673cfb4b0dc0d860a1323caa199d54950dcce # master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --file=frontend/package.json --severity-threshold=high
