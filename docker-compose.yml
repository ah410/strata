# Strata: a sample stack for Dockge or `docker compose up -d`.
# See "Install" in the README for the TrueNAS and Dockge walkthrough.

services:
  strata:
    image: ghcr.io/ah410/strata:1
    # To build from source instead: build: .
    container_name: strata
    restart: unless-stopped

    # A uid:gid with write access to your dataset, e.g. a dedicated user with
    # a Modify ACL entry. The image default (65532) usually has none.
    user: "1000:1000"

    environment:
      # The hostname you open Strata by. IPs and localhost always work.
      # STRATA_ALLOWED_HOSTS: "strata.example.com"
      # Behind a reverse proxy: its address or Docker network. Strata then
      # serves plain HTTP to it and trusts its X-Forwarded-* headers.
      # STRATA_TRUSTED_PROXIES: "172.18.0.0/16"
      TZ: "Etc/UTC"

    volumes:
      # Left: the dataset to browse. Right: always /data.
      - /mnt/tank/documents:/data
      # Passphrase hash, TLS certificate, thumbnails, favorites. Any small
      # directory writable by the user above.
      - /mnt/tank/apps/strata:/config

    ports:
      # HTTPS with a self-signed certificate unless you give it one.
      - "8443:8080"

    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    healthcheck:
      test: ["CMD", "/usr/local/bin/strata", "healthcheck"]
      interval: 30s
      timeout: 4s
      retries: 3
      start_period: 5s
